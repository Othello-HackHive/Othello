[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "othello-cable-ring"
version = "0.1.0"
description = "Cable Ring Challenge solver"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "pydantic>=2.0",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "matplotlib>=3.7", "boto3>=1.34", "moto[dynamodb,s3]>=5.0", "pyyaml>=6.0"]
viz = ["matplotlib>=3.7"]
aws = ["boto3>=1.34"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "src/othello/routing/tests", "src/othello/solver/tests"]

[tool.setuptools.packages.find]
where = ["src"]
