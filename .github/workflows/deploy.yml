name: Deploy

# Deploys the solver's web API to AWS: by hand from the Actions tab, or automatically after every green CI run on
# main once the repository variable AUTO_DEPLOY is set to true (off by default).
# Nothing happens until the one-time AWS setup is done and the repository variable
# AWS_DEPLOY_ROLE_ARN exists (see docs/DEPLOYMENT.md). No AWS password is stored anywhere:
# GitHub proves its identity with a short-lived token and AWS hands back temporary permissions.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never two deploys at once, and never cancel one halfway through.
concurrency:
  group: deploy-aws
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # lets the job ask GitHub for the short-lived identity token

env:
  AWS_REGION: us-east-1
  STACK_NAME: othello-cable-ring

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only after a green CI run on main (or a manual start), and only once the AWS role is configured.
    if: >
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (vars.AUTO_DEPLOY == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    steps:
      - name: Get the code that CI tested
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up the AWS SAM tool
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # Manual runs only. Prints the identity details GitHub presents to AWS (never the token itself), so a
      # "not authorized" answer can be compared with the role's trust rule. None of this is secret.
      - name: Show the identity GitHub presents to AWS (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          reply=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          REPLY="$reply" python3 - <<'PY'
          import base64, json, os
          token = json.loads(os.environ["REPLY"])["value"]
          part = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4)))
          for key in ("sub", "aud", "repository", "repository_owner", "repository_id", "repository_owner_id", "ref", "job_workflow_ref", "event_name"):
              print(f"{key}: {claims.get(key)}")
          PY
          echo "role variable, between brackets: [${ROLE_ARN}]"

      - name: Sign in to AWS with the temporary identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build the container images
        run: sam build --template-file infra/template.yaml

      - name: Deploy
        env:
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          OTHELLO_API_KEY: ${{ secrets.OTHELLO_API_KEY }}
          WORKER_CONCURRENCY: ${{ vars.WORKER_CONCURRENCY }}
        run: |
          # The SAM tool refuses a setting with an empty value ("ApiKey="), so a setting that is not
          # configured is simply left out and the template's own default is used.
          overrides=(
            "AllowedOrigins=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}"
            "WorkerConcurrency=${WORKER_CONCURRENCY:-0}"
          )
          if [ -n "${OTHELLO_API_KEY}" ]; then
            # the SAM tool cannot carry spaces, quotes or backslashes inside a value
            if [[ "${OTHELLO_API_KEY}" =~ [[:space:]\"\'\\] ]]; then
              echo "OTHELLO_API_KEY must not contain spaces, quotes or backslashes" >&2
              exit 1
            fi
            overrides+=("ApiKey=${OTHELLO_API_KEY}")
          fi
          sam deploy \
            --config-file infra/samconfig.toml \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${overrides[@]}"

      - name: Check that the API answers
        run: |
          url=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          echo "API address: $url"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$url/health"; then echo; exit 0; fi
            sleep 5
          done
          echo "The API did not answer /health" >&2
          exit 1
